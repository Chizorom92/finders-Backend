spring.application.name=finders-backend
server.port=${PORT:8085}

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/finders?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update

jwt.secret=${JWT_SECRET}